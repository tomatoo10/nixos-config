radarr:
  radarr_merged:
    base_url: http://<LAN-IP>:7878/
    api_key: <REDACTED>

    include:
      - template: radarr-quality-definition-movie
      # HD Bluray + Web
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web
      # UHD Bluray + Web
      - template: radarr-quality-profile-uhd-bluray-web
      - template: radarr-custom-formats-uhd-bluray-web

    quality_profiles:
      - name: UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p

    custom_formats:
      # Movie Versions
      - trash_ids:
          # Uncomment any of the following lines to prefer these movie versions
          - 570bc9ebecd92723d2d21500f4be314c # Remaster
          - eecf3a857724171f968a66cb5719e152 # IMAX
          - 9f6cbff8cfe4ebbc1bde14c7b7bec0de # IMAX Enhanced
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: UHD Bluray + WEB

      # Must have to avoid shit releases
      - trash_ids:
           - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: UHD Bluray + WEB

      - trash_ids:
        # https://trash-guides.info/Radarr/radarr-setup-quality-profiles-anime/
        # Avoid these formats:
        - ed38b889b31be83fda192888e2286d83 # BR-DISK
        - e6886871085226c3da1830830146846c # Generate Dynamic HDR
        - 90a6f9a284dff5103f6346090e6280c8 # LQ
        - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
        - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
        - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
        - 0a3f082873eb454bde444150b70253cc # Extras
        - 712d74cd88bceb883ee32f773656b1f5 # Sing-Along Versions
        - cae4ca30163749b891686f95532519bd # AV1
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: UHD Bluray + WEB
sonarr:
  sonarr_merged:
    base_url: http://<LAN-IP>:8989/  # Update this with your Sonarr URL
    api_key: <REDACTED> # Replace with your actual Sonarr API key

    include:
      # Common quality definitions
      - template: sonarr-quality-definition-series
      - template: sonarr-quality-definition-anime
      # Quality profiles
      - template: sonarr-v4-quality-profile-anime
      - template: sonarr-v4-quality-profile-web-2160p
      - template: sonarr-v4-quality-profile-web-1080p
      # Custom formats with scores
      - template: sonarr-v4-custom-formats-anime
      - template: sonarr-v4-custom-formats-web-1080p
      - template: sonarr-v4-custom-formats-web-2160p
      # - template: sonarr-v4-quality-profile-web-2160p-alternative
      # - template: sonarr-v4-quality-profile-web-1080p-alternative

    # UHD Web + Bluray Configuration
    quality_profiles:
      - name: WEB-2160p # This name come from sonarr-v4-custom-formats-web-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-1080p
          - name: HDTV-720p

      # HD Web + Bluray Configuration
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-1080p
          - name: HDTV-720p


      - name: Remux-1080p - Anime
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        min_format_score: 100
        score_set: anime-sonarr
        quality_sort: top
        qualities:
         - name: Bluray-1080p
           qualities:
             - Bluray-1080p Remux
             - Bluray-1080p
         - name: WEB 1080p
           qualities:
             - WEBDL-1080p
             - WEBRip-1080p
             - HDTV-1080p
         - name: Bluray-720p
         - name: WEB 720p
           qualities:
             - WEBDL-720p
             - WEBRip-720p
             - HDTV-720p
         - name: Bluray-480p
         - name: WEB 480p
           qualities:
             - WEBDL-480p
             - WEBRip-480p
         - name: DVD
         - name: SDTV

    custom_formats:
      - trash_ids:
        #   - 497c863b88e147fda2807eb8197c41b8 # TrueHD ATMOS
        #   - a570d4a0e56a2874b64e5bfa55202a1b # FLAC
        #   - 2f22d89048b01681dde8afe203bf2e95 # DTS X
        #   - 3cafb66171b47f226146a0770576870f # TrueHD
        #   - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
        #   - 8e109e50c0b8a8f3ef3d72a8859a8f27 # DTS-ES
        #   - d2516a5d9a83c99d16db8305c896408f # DTS
        #   - 417804f7f2c4308c1f4c5d380d4c4475 # ATMOS (undefined)
        #   - 1af239278386be2919e1bcee0bde047e # DD+ ATMOS
        #   - e7c2fcae07cbada050a0af3357491d7b # PCM
        #   - 3131e15a62c54d35c19f2a4e596cd5b5 # DD+
        #   - b9f8e3251d08204868ccd5d9d4c4ab71 # Dolby Digital Plus
        #   - 6ba9033d67b68ca3ef533d68f1ae93b5 # Dolby Digital
        #   - 9cf44037df3289f9a47defcb2d13e2d7 # AAC LC
        assign_scores_to:
          - name: WEB-1080p
          - name: WEB-2160p

      - trash_ids:
        # https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles/#trash-quality-profiles
        # Avoid these formats:
        - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
        - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
        - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
        - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        - fbcb31d8dabd2a319072b84fc0b7249c # Extras
        - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        assign_scores_to:
          - name: WEB-1080p
          - name: WEB-2160p
